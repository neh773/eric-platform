name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
# A newer commit on the same PR or branch cancels the older run. Main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Task outputs come from the Gradle build cache (org.gradle.caching in gradle.properties).
  GRADLE_CACHE_FLAG: ""
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle build and test
        run: ./gradlew build --no-daemon $GRADLE_CACHE_FLAG
      - name: Banned product terms
        run: python3 scripts/check_banned_terms.py
      - name: Case-only filename collisions
        run: python3 scripts/check_case_collisions.py
      - name: DIFFERENCES index is generated and ids are unique
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/gen_differences_index.py --check
      - name: Third-party license check
        run: python3 scripts/check_licenses.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image and smoke-test health and diagnostics
        run: bash scripts/image_smoke.sh
      - name: Container run recipes (persistent, ephemeral, restore on first boot)
        run: bash scripts/container_recipes_smoke.sh
      - name: Redundancy failover on two gateway containers
        run: bash scripts/redundancy_failover.sh

  simulators:
    name: Simulator stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start the compose stack and smoke-test each service
        # Talks to live containers, so it never takes results from the build cache.
        run: ./gradlew :test-infra:support:smokeTest :test-infra:perf-sim:perfSimTest :gateway:server:simulatorCommsTest --no-daemon --no-build-cache
      - name: Upload simulator smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-reports
          path: |
            test-infra/support/build/reports/tests/smokeTest/
            gateway/server/build/reports/tests/simulatorCommsTest/

  web:
    # Playwright 1.56.1 has no ubuntu26.04 host support; ubuntu-latest is 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Web dependency licenses
        run: python3 scripts/check_npm_licenses.py
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build gateway for admin end-to-end tests
        working-directory: ${{ github.workspace }}
        run: ./gradlew :gateway:server:installDist --no-daemon $GRADLE_CACHE_FLAG
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  bench:
    name: Load bench
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: bench
        run: python3 -m unittest discover -s tests -v
      - name: Simulator image self-test
        run: |
          docker build -t oip-bench-points:ci -f bench/sim/Dockerfile bench
          docker run --rm oip-bench-points:ci python -u /app/server.py --self-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Driver floors on a container network
        # A measurement: always re-run, never restored from the build cache.
        run: ./gradlew :test-infra:driver-floors:driverFloorTest --no-daemon --no-build-cache
      - name: Historian soak, CI size (PRF-008)
        # test-infra/perf/prf-008.json "ci": above the 10,000 changes/s floor with a database cut, then the stretch.
        run: ./gradlew :test-infra:load-soak:historianSoakTest --no-daemon --no-build-cache
      - name: Full load, CI size (PRF-003)
        # test-infra/perf/prf-003.json "ci": drivers, historian, alarms, and 75 sessions against the bench simulator.
        run: ./gradlew :test-infra:load-soak:fullLoadTest --no-daemon --no-build-cache
      - name: Perf regression gate (PRF-013)
        # Any tracked result more than 15% worse than its accepted baseline for the same scenario and size fails.
        # A result with no baseline is listed as "no baseline". Baselines: test-infra/perf/perf-requirements.json.
        run: python3 scripts/perf_regression.py --result test-infra/load-soak/build/reports/load-soak/*.json
      - name: Upload load-soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-soak-reports
          path: test-infra/load-soak/build/reports/load-soak/
          if-no-files-found: ignore

  plc:
    name: PLC runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compiler toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Scan engine tests
        run: cargo test --manifest-path plc/eric-plc/Cargo.toml --locked
      - name: Example program, two-second scan
        run: bash plc/eric-plc/scripts/smoke.sh

  docs:
    name: Docs site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        run: npm ci
      - name: Build the manual site
        run: npm run build

# Windows installers. Not part of the pull-request or main CI jobs.
# Windows runners bill at 2x minutes, so this runs only for version tags and manual dispatch.
name: Release installers
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a pre-release with this tag (for example v0.1.0-beta). Leave empty to only build."
        required: false
        default: ""
permissions:
  contents: write
env:
  # The build version comes from the tag (v0.1.1-beta -> 0.1.1-beta); untagged manual runs stay SNAPSHOT.
  ERIC_BUILD_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the admin UI and Control Canvas
        working-directory: web
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oip/admin build
          pnpm --filter @oip/designer build
      - name: Install WiX 3.14
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $dest = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31") { throw "WiX checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build gateway and designer installers
        shell: pwsh
        run: .\gradlew.bat :packaging:windowsInstallers --no-daemon
      - name: Link a PLC program with the bundled LLVM linker (Visual Studio hidden)
        shell: pwsh
        env:
          ERIC_TEST_PLC_DIR: ${{ github.workspace }}\packaging\build\plc-bundle
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { Rename-Item $vswhere "vswhere.exe.eric-hidden" }
          try {
            .\gradlew.bat :gateway:server:test --tests org.oip.gateway.WindowsPlcLinkTest --tests org.oip.gateway.PlcCompilerIncludesTest --no-daemon
            if ($LASTEXITCODE -ne 0) { throw "Windows PLC link tests failed" }
            $xml = Get-Content gateway\server\build\test-results\test\TEST-org.oip.gateway.WindowsPlcLinkTest.xml -Raw
            if ($xml -match "<skipped") { throw "WindowsPlcLinkTest was skipped: the PLC bundle was not found" }
          } finally {
            $hidden = "$vswhere.eric-hidden"
            if (Test-Path $hidden) { Rename-Item $hidden "vswhere.exe" }
          }
      - name: Install, run, uninstall (keep data and delete data)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\smoke.ps1
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: packaging/build/dist/*.exe
          if-no-files-found: ignore

  linux-image:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the admin UI and Control Canvas
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oip/admin build
          pnpm --filter @oip/designer build
      - name: Build Linux app images
        run: ./gradlew :packaging:gatewayAppImage :packaging:designerAppImage --no-daemon
      - name: Pack the images
        run: tar -C packaging/build -czf linux-app-images.tar.gz image
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-images
          path: linux-app-images.tar.gz

  publish:
    needs: [installers, linux-image]
    # A version-tag push publishes. A manual run publishes only when a tag is given;
    # the action then creates that tag on the commit that was built.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the release files
        id: names
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v0.1.0-beta, got '$TAG'"; exit 1 ;; esac
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          gateway=$(ls dist/windows-installers/ERIC\ Gateway-*.exe)
          designer=$(ls dist/windows-installers/Control\ Canvas-*.exe)
          cp "$gateway" "release/ERIC-Gateway-${version}-windows-x64.exe"
          cp "$designer" "release/Control-Canvas-${version}-windows-x64.exe"
          cp dist/linux-app-images/linux-app-images.tar.gz "release/ERIC-${version}-linux-x64-app-images.tar.gz"
          sed "s/{{version}}/${version}/g" .github/release/notes.md > release-notes.md
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ERIC ${{ steps.names.outputs.version }}
          prerelease: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release/*

id: org.oip.driver-opcua-client
version: 0.1.0
name: OPC UA Client
entrypoint: org.oip.opcua.OpcUaClientModule
dependencies: []
permissions:
  - device.connect
configSchema:
  type: object
  properties:
    requestTimeoutMs:
      type: integer
      minimum: 1
      maximum: 120000
      default: 5000
    keepAliveIntervalMs:
      type: integer
      minimum: 50
      default: 5000
    sessionTimeoutMs:
      type: integer
      minimum: 1000
      default: 60000
    reconnectInitialMs:
      type: integer
      minimum: 1
      default: 500

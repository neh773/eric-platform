# Windows installers. Not part of the pull-request or main CI jobs.
# Windows runners bill at 2x minutes, so this runs only for version tags and manual dispatch.
name: Release installers
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the admin UI and Control Canvas
        working-directory: web
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oip/admin build
          pnpm --filter @oip/designer build
      - name: Install WiX 3.14
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $dest = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31") { throw "WiX checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build gateway and designer installers
        shell: pwsh
        run: .\gradlew.bat :packaging:windowsInstallers --no-daemon
      - name: Install, run, uninstall (keep data and delete data)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\windows\smoke.ps1
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: packaging/build/dist/*.exe
          if-no-files-found: ignore

  linux-image:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the admin UI and Control Canvas
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oip/admin build
          pnpm --filter @oip/designer build
      - name: Build Linux app images
        run: ./gradlew :packaging:gatewayAppImage :packaging:designerAppImage --no-daemon
      - name: Pack the images
        run: tar -C packaging/build -czf linux-app-images.tar.gz image
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-images
          path: linux-app-images.tar.gz

  publish:
    needs: [installers, linux-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installers/*
            dist/linux-app-images/*
          body: |
            ERIC v0.1.0 is BETA software and must only be used with hardware for testing purposes under safe conditions — not for live production, life-safety, or equipment-protection use. It is provided AS IS with no warranty (AGPL-3.0).
            The Windows files are the gateway and Control Canvas installers. The Linux file is a jpackage app-image archive, not a package-manager installer.
          generate_release_notes: true

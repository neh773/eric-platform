# Sample: TLS termination and websocket upgrade in front of one gateway.
# Replace the names, the certificate bundle and the server address. Test with `haproxy -c -f haproxy.cfg`.
# Add the proxy's address to http.trustedProxies in gateway.yaml (see ../reverse-proxy.md).

global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

frontend web
    bind :80
    bind :443 ssl crt /etc/haproxy/tls/hmi.pem alpn h2,http/1.1
    http-request redirect scheme https code 308 unless { ssl_fc }

    # The browser's view of the request. These replace anything the client sent.
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host  %[req.hdr(Host)]
    http-request set-header X-Forwarded-For   %[src]
    # http-request set-header X-Forwarded-Prefix /oip   # only when published under a path

    default_backend gateway

backend gateway
    # Websocket upgrades pass through unchanged in HTTP/1.1 mode.
    server gw1 10.0.0.10:8090 check

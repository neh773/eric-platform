apiVersion: v1
kind: Service
metadata:
  name: {{ include "oip-gateway.fullname" . }}
  labels:
    {{- include "oip-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "oip-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.service.nodePort (ne .Values.service.type "ClusterIP") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.gatewayNetwork.enabled }}
    - name: gateway-network
      port: {{ .Values.gatewayNetwork.port }}
      targetPort: gateway-network
      protocol: TCP
    {{- end }}

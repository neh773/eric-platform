# Sample: TLS termination and websocket upgrade in front of one gateway.
# Replace the names, the certificate paths and the upstream address. Test with `nginx -t`.
# Add the proxy's address to http.trustedProxies in gateway.yaml (see ../reverse-proxy.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream oip_gateway {
    server 10.0.0.10:8090;
    keepalive 16;
}

server {
    listen 80;
    server_name hmi.example.test;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hmi.example.test;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 256m;

    location / {
        proxy_pass http://oip_gateway;
        proxy_http_version 1.1;

        # Websocket upgrade for /api/v1/ws.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The browser's view of the request. These replace anything the client sent.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # proxy_set_header X-Forwarded-Prefix /oip;   # only when published under a path

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

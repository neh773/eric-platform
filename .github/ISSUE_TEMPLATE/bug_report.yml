name: Bug report
description: Something in ERIC 0.1.x beta failed on the bench.
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ERIC v0.1.1 is BETA software. Use it only on hardware set up for testing. Remove passwords and plant addresses from logs before you attach them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.1-beta
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Gateway log with secrets removed. On Windows the service writes under C:\ProgramData\ERIC\gateway.
    validations:
      required: true
